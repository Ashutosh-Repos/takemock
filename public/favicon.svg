<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#03060c"/>
    </linearGradient>
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#1e3a8a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="tHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Main Glass Squircle Body -->
  <rect x="56" y="56" width="400" height="400" rx="90" fill="url(#bg)"/>
  <rect x="56" y="56" width="400" height="400" rx="90" fill="none" stroke="url(#glassRim)" stroke-width="4"/>

  <!-- Liquid Glass "T" with Neon Glow -->
  <g filter="url(#neonGlow)">
    <path d="M 148 156 C 148 140 160 130 176 130 L 336 130 C 352 130 364 140 364 156 C 364 170 352 180 336 180 L 284 180 C 278 180 274 184 274 190 L 274 360 C 274 374 263 382 256 382 C 249 382 238 374 238 360 L 238 190 C 238 184 234 180 228 180 L 176 180 C 160 180 148 170 148 156 Z" fill="url(#tGrad)"/>
    <path d="M 154 146 C 154 138 162 134 174 134 L 338 134 C 350 134 358 138 358 146 C 358 152 350 156 338 156 L 174 156 C 162 156 154 152 154 146 Z" fill="url(#tHighlight)"/>
  </g>
</svg>