[package]
name = "document-intelligence-c-abi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Universal C-ABI dynamic and static library interface for the Document Intelligence Engine"

[lib]
name = "document_intelligence_engine"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
document-intelligence-core = { path = "../document-intelligence-core" }
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
image.workspace = true

[build-dependencies]
cbindgen = "0.26"

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
