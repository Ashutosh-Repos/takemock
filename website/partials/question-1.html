<div class="q-content" id="demo-question-text">
  A particle of mass $m$ moves in an attractive central force field $V(r) = -\frac{k}{r}$. The effective radial potential and total orbital energy are:
</div>

<div class="q-formula" id="demo-formula" data-tex="E = \frac{1}{2} m \dot{r}^2 + \frac{L^2}{2 m r^2} - \frac{k}{r}">
  $$E = \frac{1}{2} m \dot{r}^2 + \frac{L^2}{2 m r^2} - \frac{k}{r}$$
</div>

<div class="options-list" id="demo-options" role="radiogroup" aria-label="Question 1 options">
  <button type="button" class="option-item" role="radio" aria-checked="false" tabindex="0" onclick="selectDemoOption(this, 1)">
    <span class="option-circle">A</span>
    <span class="option-text">$E < 0$ results in a bound elliptical Keplerian orbit</span>
  </button>
  <button type="button" class="option-item" role="radio" aria-checked="false" tabindex="-1" onclick="selectDemoOption(this, 2)">
    <span class="option-circle">B</span>
    <span class="option-text">$E = 0$ results in a circular stable orbit</span>
  </button>
  <button type="button" class="option-item" role="radio" aria-checked="false" tabindex="-1" onclick="selectDemoOption(this, 3)">
    <span class="option-circle">C</span>
    <span class="option-text">$E > 0$ gives a closed periodic trajectory</span>
  </button>
  <button type="button" class="option-item" role="radio" aria-checked="false" tabindex="-1" onclick="selectDemoOption(this, 4)">
    <span class="option-circle">D</span>
    <span class="option-text">Orbital angular momentum $L$ is not conserved</span>
  </button>
</div>
