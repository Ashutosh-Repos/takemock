[workspace]
members = [
    "crates/takemock-core",
    "crates/takemock-cv",
    "crates/takemock-layout",
    "crates/takemock-solver",
    "crates/takemock-vlm",
    "crates/takemock-c-abi",
    "crates/takemock-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["TakeMock Team"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
rayon = "1.10"
tempfile = "3.10"
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
