[workspace]
resolver = "2"
members = [
    "crates/document-intelligence-core",
    "crates/document-intelligence-c-abi",
    "crates/document-intelligence-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["TakeMock Team"]
license = "MIT"
repository = "https://github.com/takemock/takemock"

[workspace.dependencies]
# Serialization & Modeling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Embedded Relational Session Graph (SQLite WAL)
rusqlite = { version = "0.33", features = ["bundled"] }

# Image & Computer Vision Primitives
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Parallelism & Concurrency
rayon = "1.10"
crossbeam-channel = "0.5"

# System Monitoring & Hardware Governors
sysinfo = "0.33"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI & Testing Utilities
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.17"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true
strip = false

[profile.dev.package."*"]
opt-level = 3
